<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login | Next Millionaire</title>
	<!-- Pages in /html go up one folder to load the shared stylesheet. -->
	<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
	<!-- Shared navigation links the login page to the rest of the site. -->
	<header class="site-header">
		<a class="site-name" href="../index.html">Next Millionaire</a>
		<nav aria-label="Main navigation">
			<a href="login.html" aria-current="page" data-auth-link>Login</a>
			<a href="signup.html" data-auth-link>Sign up</a>
			<a href="#" data-logout hidden>Log out</a>
		</nav>
	</header>
	<main>
		<section class="card form-card">
			<h1>Welcome back</h1>
			<p class="intro">Log in to continue. This browser-only demo stores accounts in local storage.</p>
			<!-- novalidate leaves validation to the JavaScript submit handler in app.js. -->
			<form id="login-form" novalidate>
				<label for="email">Email address</label>
				<input
					id="email"
					name="email"
					type="email"
					inputmode="email"
					autocomplete="email"
					placeholder="e.g. name@gmail.com"
					required
				>
				<label for="password">Password</label>
				<input
					id="password"
					name="password"
					type="password"
					autocomplete="current-password"
					placeholder="Enter your password"
					required
				>
				<button type="submit">Log in</button>
				<p class="form-message" id="login-message" role="status" aria-live="polite"></p>
			</form>
			<p class="form-links">Don't have an account? <a href="signup.html">Sign up</a></p>
		</section>
	</main>
	<!-- app.js handles account checks, inline error messages, and the successful redirect. -->
	<script src="../js/app.js"></script>
</body>
</html>
