<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign up | Next Millionaire</title>
	<!-- Signup shares the site's responsive layout and form styles. -->
	<link rel="stylesheet" href="../css/styles.css">
</head>

<body>
	<!-- The same navigation structure keeps page-to-page links consistent. -->
	<header class="site-header">
		<a class="site-name" href="../index.html">Next Millionaire</a>
		<nav aria-label="Main navigation">
			<a href="login.html" data-auth-link>Login</a>
			<a href="signup.html" aria-current="page" data-auth-link>Sign up</a>
			<a href="#" data-logout hidden>Log out</a>
		</nav>
	</header>
	<main>
		<section class="card form-card">
			<h1>Create an account</h1>
			<p class="intro">Create an account for this browser-only demo. Do not use a real password.</p>
			<!-- novalidate lets app.js check each value and show accessible inline feedback. -->
			<form id="signup-form" novalidate>
				<label for="name">Name</label>
				<input id="name" name="name" type="text" autocomplete="name" placeholder="e.g. Alex Kumar" required>
				<label for="email">Email address</label>
				<input id="email" name="email" type="email" inputmode="email" autocomplete="email"
					placeholder="e.g. name@gmail.com or name@yahoo.com" required>
				<label for="password">Password</label>
				<input id="password" name="password" type="password" autocomplete="new-password"
					placeholder="At least 8 characters" required>
				<label for="confirm-password">Confirm password</label>
				<input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password"
					placeholder="Enter the same password again" required>
				<button type="submit">Create account</button>
				<p class="form-message" id="signup-message" role="status" aria-live="polite"></p>
			</form>
			<p class="form-links">Already have an account? <a href="login.html">Log in</a></p>
		</section>
	</main>
	<!-- app.js validates and stores the demo account in browser localStorage. -->
	<script src="../js/app.js"></script>
</body>

</html>
