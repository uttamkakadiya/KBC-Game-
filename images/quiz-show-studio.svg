<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
	<!-- Original stage illustration used behind the quiz; SVG scales cleanly to every screen. -->
	<defs>
		<linearGradient id="backdrop" x1="800" y1="0" x2="800" y2="1000" gradientUnits="userSpaceOnUse">
			<stop stop-color="#070D2A"/>
			<stop offset=".52" stop-color="#111456"/>
			<stop offset="1" stop-color="#050817"/>
		</linearGradient>
		<radialGradient id="stage" cx="0" cy="0" r="1" gradientTransform="matrix(0 550 -880 0 800 770)" gradientUnits="userSpaceOnUse">
			<stop stop-color="#233C93" stop-opacity=".9"/>
			<stop offset=".58" stop-color="#101653" stop-opacity=".53"/>
			<stop offset="1" stop-color="#080B1F" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="beamBlue" x1="0" y1="0" x2="0" y2="1">
			<stop stop-color="#75D7FF" stop-opacity=".3"/>
			<stop offset="1" stop-color="#6176FF" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="beamGold" x1="0" y1="0" x2="0" y2="1">
			<stop stop-color="#FFE7A1" stop-opacity=".33"/>
			<stop offset="1" stop-color="#FFB743" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="ring" x1="800" y1="675" x2="800" y2="955" gradientUnits="userSpaceOnUse">
			<stop stop-color="#E8C777"/>
			<stop offset=".52" stop-color="#8D7FE8"/>
			<stop offset="1" stop-color="#5CCBFF"/>
		</linearGradient>
		<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
			<feGaussianBlur stdDeviation="12"/>
		</filter>
	</defs>
	<path fill="url(#backdrop)" d="M0 0h1600v1000H0z"/>
	<path fill="url(#stage)" d="M0 0h1600v1000H0z"/>
	<path fill="url(#beamBlue)" d="m230 94 150-5 440 700-248 21L230 94Z"/>
